<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Private Garden of Thoughts</title>
    <style>
        /* --- Themes Configurations (Mininote Inspired) --- */
        :root {
            --bg-main: #fff5f6;
            --bg-sidebar: #ffe3e8;
            --bg-card: #ffffff; 
            --border: #f7b1bd;
            --text-main: #4a282d;
            --text-muted: #8c6066;
            --accent: #ff8fa3;
            --accent-hover: #ff758f;
            --danger: #e56b6f;
            --hl-pink: #ffccd5;
            --hl-yellow: #fff3b0;
            --hl-green: #c7f9cc;
            --floral-pattern: url('https://www.transparenttextures.com/patterns/floral-paper.png');
        }

        [data-theme="matcha"] {
            --bg-main: #f0f7f4;
            --bg-sidebar: #dbebe1;
            --bg-card: #ffffff;
            --border: #a3c9b1;
            --text-main: #2c4c38;
            --text-muted: #537a62;
            --accent: #87b396;
            --accent-hover: #6a9679;
            --danger: #e56b6f;
        }

        [data-theme="lemon"] {
            --bg-main: #fefae0;
            --bg-sidebar: #f4f1de;
            --bg-card: #ffffff;
            --border: #dcd7ad;
            --text-main: #432818;
            --text-muted: #725e43;
            --accent: #bda87f;
            --accent-hover: #a69065;
            --danger: #e56b6f;
        }

        [data-theme="indigo"] {
            --bg-main: #1a1a2e;
            --bg-sidebar: #16213e;
            --bg-card: #1f4068;
            --border: #0f3460;
            --text-main: #e2e2e2;
            --text-muted: #9aa4b2;
            --accent: #e94560;
            --accent-hover: #ff5c77;
            --danger: #ff6b6b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-main);
            background-image: var(--floral-pattern);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            font-family: 'Georgia', serif;
            transition: background-color 0.3s ease;
        }

        /* --- Full Screen Overlays --- */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            background-image: var(--floral-pattern);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-container {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 10px 25px rgba(247, 177, 189, 0.3);
        }

        .lock-container h1 { font-size: 1.6rem; font-style: italic; margin-bottom: 0.5rem; }
        .password-input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            margin-bottom: 1rem;
        }
        
        .error-message { color: var(--danger); font-size: 0.9rem; margin-bottom: 1rem; font-style: italic; }

        /* --- Sidebar Styling --- */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            z-index: 1000;
        }

        .sidebar h2 {
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
            text-align: center;
            font-style: italic;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 0.5rem;
        }

        .search-box {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-main);
            margin-bottom: 1rem;
            outline: none;
        }

        .entry-list { flex: 1; overflow-y: auto; margin-bottom: 1rem; }
        .entry-item {
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 15px;
            margin-bottom: 0.75rem;
            cursor: pointer;
        }
        .entry-item.active { border-color: var(--accent-hover); background: rgba(255, 255, 255, 0.4); }
        .entry-item .date { font-size: 0.8rem; color: var(--accent-hover); font-weight: bold; }
        
        .entry-meta-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .entry-item .preview {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; z-index: 5; gap: 0.5rem; flex-wrap: wrap; }
        .left-toolbar-group { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .current-date { font-size: 1.1rem; font-style: italic; }
        .btn-group { display: flex; align-items: center; gap: 0.5rem; }

        /* Theme Dropper */
        .theme-selector select {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            outline: none;
            min-height: 40px;
        }

        /* Mood Selector Area */
        .mood-container {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-card);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            min-height: 40px;
        }
        .mood-container span { font-size: 0.8rem; font-style: italic; color: var(--text-muted); margin-right: 2px;}
        .mood-selector-btn {
            background: none;
            border: 2px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 2px;
            transition: transform 0.1s ease;
        }
        .mood-selector-btn:hover { transform: scale(1.2); }
        .mood-selector-btn.active { border-color: var(--accent); background: rgba(0,0,0,0.05); }

        button, .toggle-sidebar-btn {
            padding: 0.6rem 1rem;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            white-space: nowrap;
        }

        .btn-primary { background-color: var(--accent); color: white; }
        .btn-secondary { background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); }
        .btn-danger { background-color: transparent; color: var(--danger); }
        .toggle-sidebar-btn { background-color: var(--bg-sidebar); border: 1px solid var(--border); color: var(--text-main); }

        /* --- Text Editor Area --- */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(247, 177, 189, 0.15);
            z-index: 2;
        }

        .editor-tools {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1rem;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; 
            position: relative;
        }
        .editor-tools::-webkit-scrollbar { display: none; }

        .tool-btn, .tool-select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            min-height: 35px;
            cursor: pointer;
            outline: none;
        }

        .bullet-tools {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-card);
            padding: 0.2rem 0.5rem;
            border-radius: 15px;
            border: 1px solid var(--border);
        }
        .bullet-tools span { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-right: 0.2rem; }

        .highlight-palette {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-card);
            padding: 0.2rem 0.5rem;
            border-radius: 15px;
            border: 1px solid var(--border);
            min-height: 35px;
        }
        .highlight-palette span { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-right: 0.2rem; }
        .hl-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .workspace-split { display: flex; flex: 1; overflow: hidden; position: relative; }

        .editor-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.7;
            outline: none;
            overflow-y: auto;
            position: relative; 
            -webkit-overflow-scrolling: touch;
            z-index: 1;
        }

        .editor-input[placeholder]:empty:before {
            content: attr(placeholder);
            color: var(--text-muted);
            font-style: italic;
        }

        .editor-input ul {
            list-style: none;
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        .editor-input ul li {
            position: relative;
            margin-bottom: 0.4rem;
        }
        .editor-input ul li::before {
            content: attr(data-emoji);
            position: absolute;
            left: -1.5rem;
            top: 0;
        }

        /* --- Sticker Side Drawer --- */
        .scrapbook-sidebar {
            width: 150px;
            background: rgba(255, 255, 255, 0.4);
            border-left: 1px dashed var(--border);
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .scrapbook-sidebar h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            border-bottom: 1px dotted var(--border);
            padding-bottom: 0.2rem;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            justify-items: center;
        }

        .tray-sticker {
            font-size: 2rem;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .tray-sticker:active { transform: scale(1.2); }

        /* --- ADJUSTABLE ASSETS --- */
        .scrapbook-asset {
            position: absolute;
            cursor: move;
            z-index: 50;
            touch-action: none;
            display: inline-block;
            padding: 14px;
            border: 1px solid transparent;
        }

        .scrapbook-asset:hover, .scrapbook-asset:active {
            border: 1px dashed var(--accent);
            border-radius: 6px;
        }

        .asset-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .scrapbook-asset.sticker-asset .asset-wrapper { line-height: 1; }
        
        .scrapbook-asset.photo-asset .asset-wrapper {
            background: white;
            padding: 6px 6px 6px 6px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(247, 177, 189, 0.25);
            border-radius: 4px;
        }

        .scrapbook-asset.photo-asset img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* --- CUTE CUSTOM FRAMES STYLES --- */
        .frame-none { }
        
        .frame-blossom {
            border: 6px double #ffccd5 !important;
            padding: 4px !important;
            background: #fff0f2 !important;
            border-radius: 12px !important;
        }
        
        .frame-coquette {
            border: 3px solid #ff8fa3 !important;
            border-radius: 8px !important;
            position: relative;
        }
        .frame-coquette::before { content: '🎀'; position: absolute; top: -10px; left: -10px; font-size: 1.2rem; z-index: 10; }
        .frame-coquette::after { content: '🎀'; position: absolute; bottom: -10px; right: -10px; font-size: 1.2rem; z-index: 10; }

        .frame-vintage {
            background: #fdfaf7 !important;
            padding: 8px 8px 32px 8px !important; 
            border: 1px solid #e2d9cf !important;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12) !important;
            border-radius: 2px !important;
        }

        .frame-sparkle {
            border: 3px dashed #fff3b0 !important;
            padding: 6px !important;
            box-shadow: 0 0 12px #fff3b0 !important;
            border-radius: 14px !important;
        }

        .frame-gingham {
            border: 8px solid #ffccd5 !important;
            border-image: repeating-linear-gradient(45deg, #ffccd5, #ffccd5 10px, #ffffff 10px, #ffffff 20px) 10 !important;
            padding: 4px !important;
        }

        .frame-clean {
            border: 4px solid #ebd2b0 !important; 
            padding: 2px !important;
            border-radius: 0px !important;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.15) !important;
        }

        /* --- FRAME SELECT MODAL POPUP --- */
        .frame-popup {
            position: absolute;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 0.75rem;
            box-shadow: 0 8px 24px rgba(74, 40, 45, 0.18), 0 2px 8px rgba(247, 177, 189, 0.4);
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            z-index: 2000; 
            top: 45px;
        }
        .frame-opt {
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            cursor: pointer;
            background: var(--bg-main);
        }
        .frame-opt:hover { background: var(--bg-sidebar); }

        /* --- CONTROL HANDLES --- */
        .control-handle {
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 60;
            color: var(--text-main);
            user-select: none;
        }

        .scrapbook-asset:hover .control-handle,
        .scrapbook-asset:active .control-handle {
            display: flex;
        }

        .handle-delete { top: -12px; right: -12px; background: var(--danger); color: white; }
        .handle-resize { bottom: -12px; right: -12px; cursor: se-resize; background: #fff3b0; }
        .handle-rotate { top: -12px; left: -12px; cursor: grab; background: #c7f9cc; }
        .handle-frame { bottom: -12px; left: -12px; background: var(--bg-sidebar); cursor: pointer; font-size: 0.7rem; }

        #imageInput { display: none; }

        /* --- RESPONSIVE LAYOUTS --- */
        @media (max-width: 850px) {
            body { position: relative; }
            .sidebar { 
                position: absolute; 
                left: 0; 
                top: 0; 
                transform: translateX(-100%); 
                width: 280px;
                box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            }
            .sidebar.open { transform: translateX(0); }
            .workspace-split { flex-direction: column; }
            .scrapbook-sidebar { 
                width: 100%; 
                height: 85px; 
                border-left: none; 
                border-top: 1px dashed var(--border); 
                padding: 0.5rem; 
                flex-direction: row; 
                align-items: center;
                gap: 0.5rem;
            }
            .scrapbook-sidebar h4 { display: none; }
            .sticker-grid { 
                display: flex; 
                flex-direction: row; 
                overflow-x: auto; 
                width: 100%; 
                gap: 1rem; 
                padding: 0 0.5rem;
            }
            .tray-sticker { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div id="lockScreen" class="fullscreen-overlay" style="display: flex;">
        <div class="lock-container">
            <h1>Secret Garden 🔐</h1>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1.5rem;">Enter your passcode to open your diary</p>
            <input type="password" id="passwordField" class="password-input" placeholder="6-Digit Secret Key" maxlength="6" onkeydown="if(event.key === 'Enter') unlockDiary()">
            <div id="errMessage" class="error-message"></div>
            <button class="btn-primary" style="width: 100%;" onclick="unlockDiary()">Unlock Entry</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <h2>My Blooming Thoughts 🌸</h2>
        <button class="btn-primary" style="margin-bottom: 1rem;" onclick="createNewEntry()">+ New Entry</button>
        <input type="text" class="search-box" id="search" placeholder="Search memories..." oninput="renderEntryList()">
        <div class="entry-list" id="entryList"></div>
        <button class="btn-secondary" onclick="exportBackup()">📥 Download Backup</button>
    </div>

    <div class="main-content" id="mainWorkspace">
        <div class="toolbar">
            <div class="left-toolbar-group">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">📖 Journal</button>
                <div class="current-date" id="displayDate">Select or Create an Entry</div>
                
                <div class="theme-selector">
                    <select id="themeSelect" onchange="changeTheme(this.value)">
                        <option value="default">🍬 Cotton Candy</option>
                        <option value="matcha">🍵 Matcha Latte</option>
                        <option value="lemon">🍋 Lemon Sorbet</option>
                        <option value="indigo">🌌 Midnight Indigo</option>
                    </select>
                </div>
            </div>
            
            <div class="btn-group">
                <div class="mood-container" id="moodPickerContainer" style="display: none;">
                    <span>Mood:</span>
                    <button class="mood-selector-btn active" data-mood="😊" onclick="setEntryMood('😊')">😊</button>
                    <button class="mood-selector-btn" data-mood="🥰" onclick="setEntryMood('🥰')">🥰</button>
                    <button class="mood-selector-btn" data-mood="😴" onclick="setEntryMood('😴')">😴</button>
                    <button class="mood-selector-btn" data-mood="😢" onclick="setEntryMood('😢')">😢</button>
                    <button class="mood-selector-btn" data-mood="😡" onclick="setEntryMood('😡')">😡</button>
                </div>
                <button class="btn-danger" id="deleteBtn" onclick="deleteCurrentEntry()" style="display: none;">Delete</button>
                <button class="btn-primary" id="saveBtn" onclick="saveCurrentEntry()" style="display: none;">Save</button>
            </div>
        </div>

        <div class="editor-container" id="editorContainer" style="display: none;">
            <div class="editor-tools">
                <button class="tool-btn" style="font-weight: bold;" onclick="formatDoc('bold')">B</button>
                <button class="tool-btn" style="font-style: italic;" onclick="formatDoc('italic')">I</button>
                
                <div class="bullet-tools">
                    <span>Lists:</span>
                    <button class="tool-btn" onclick="insertCuteBullet('🌸')">🌸</button>
                    <button class="tool-btn" onclick="insertCuteBullet('🎀')">🎀</button>
                    <button class="tool-btn" onclick="insertCuteBullet('⭐')">⭐</button>
                    <button class="tool-btn" onclick="insertCuteBullet('🧸')">🧸</button>
                </div>

                <select class="tool-select" id="fontSelector" onchange="formatDoc('fontName', this.value)">
                    <option value="Georgia">Georgia</option>
                    <option value="'Courier New', monospace">Courier</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                    <option value="sans-serif">Arial</option>
                </select>

                <div class="highlight-palette">
                    <span>Highlight:</span>
                    <div class="hl-dot" style="background: var(--hl-pink);" onmousedown="event.preventDefault(); formatDoc('backColor', '#ffccd5');" ontouchstart="event.preventDefault(); formatDoc('backColor', '#ffccd5');"></div>
                    <div class="hl-dot" style="background: var(--hl-yellow);" onmousedown="event.preventDefault(); formatDoc('backColor', '#fff3b0');" ontouchstart="event.preventDefault(); formatDoc('backColor', '#fff3b0');"></div>
                    <div class="hl-dot" style="background: var(--hl-green);" onmousedown="event.preventDefault(); formatDoc('backColor', '#c7f9cc');" ontouchstart="event.preventDefault(); formatDoc('backColor', '#c7f9cc');"></div>
                    <div class="hl-dot" style="background: #ffffff; position: relative;" onmousedown="event.preventDefault(); formatDoc('backColor', 'transparent');" ontouchstart="event.preventDefault(); formatDoc('backColor', 'transparent');">
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); width: 100%; height: 1px; background: red;"></div>
                    </div>
                </div>

                <button class="tool-btn" onclick="document.getElementById('imageInput').click()">🖼️ Add Floating Photo</button>
                <input type="file" id="imageInput" accept="image/*" onchange="handleScrapbookImageUpload(event)">

                <div class="frame-popup" id="frameDropdown">
                    <div class="frame-opt" onclick="applyFrameStyle('none')">❌ None</div>
                    <div class="frame-opt" onclick="applyFrameStyle('blossom')">🌸 Blossom</div>
                    <div class="frame-opt" onclick="applyFrameStyle('coquette')">🎀 Bows</div>
                    <div class="frame-opt" onclick="applyFrameStyle('vintage')">🎞️ Vintage</div>
                    <div class="frame-opt" onclick="applyFrameStyle('sparkle')">✨ Sparkle</div>
                    <div class="frame-opt" onclick="applyFrameStyle('gingham')">🧸 Ribbon</div>
                    <div class="frame-opt" onclick="applyFrameStyle('clean')">🌟 Gold</div>
                </div>
            </div>
            
            <div class="workspace-split">
                <div class="editor-input" id="diaryText" contenteditable="true" placeholder="Pour your heart out here..."></div>
                
                <div class="scrapbook-sidebar">
                    <h4>Stickers ✨</h4>
                    <div class="sticker-grid">
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '🌸')">🌸</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '💖')">💖</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '🎀')">🎀</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '🧸')">🧸</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '🐱')">🐱</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '🧁')">🧁</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '⭐')">⭐</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '☁️')">☁️</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '🎨')">🎨</div>
                        <div class="tray-sticker" onclick="spawnAsset('sticker', '💘')">💘</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let entries = {};
        let currentEntryId = null;
        let activeFrameAssetId = null; 
        let selectedMood = '😊';

        window.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            document.addEventListener('click', (e) => {
                if(!e.target.classList.contains('handle-frame') && !e.target.closest('#frameDropdown')) {
                    document.getElementById('frameDropdown').style.display = 'none';
                }
            });
        });

        // --- Theme Selector Logic ---
        function changeTheme(themeName) {
            if (themeName === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', themeName);
            }
            localStorage.setItem('diary-theme', themeName);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('diary-theme') || 'default';
            const selectEl = document.getElementById('themeSelect');
            if(selectEl) selectEl.value = savedTheme;
            changeTheme(savedTheme);
        }

        // --- Mood Tracking Operations ---
        function setEntryMood(moodEmoji) {
            selectedMood = moodEmoji;
            document.querySelectorAll('.mood-selector-btn').forEach(btn => {
                if(btn.getAttribute('data-mood') === moodEmoji) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function unlockDiary() {
            const password = document.getElementById('passwordField').value;
            if (password !== "200600") {
                document.getElementById('errMessage').innerText = "Incorrect passcode... 💕";
                return;
            }

            // Load completely from Local Browser memory cache fallback
            entries = JSON.parse(localStorage.getItem('private_floral_diary_entries')) || {};

            const lockScreen = document.getElementById('lockScreen');
            lockScreen.style.opacity = '0';
            setTimeout(() => lockScreen.style.visibility = 'hidden', 500);
            
            renderEntryList();
            
            const sortedDates = Object.keys(entries).sort((a, b) => b.localeCompare(a));
            if (sortedDates.length > 0) {
                loadEntry(sortedDates[0]);
            }
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('open'); 
        }

        function renderEntryList() {
            const query = document.getElementById('search').value.toLowerCase().trim();
            const listContainer = document.getElementById('entryList');
            listContainer.innerHTML = '';

            const sortedKeys = Object.keys(entries).sort((a, b) => b.localeCompare(a));

            sortedKeys.forEach(idStr => {
                const entry = entries[idStr];
                const cleanText = entry.text.replace(/<[^>]*>/g, '');
                
                if (query && !entry.display_date.toLowerCase().includes(query) && !cleanText.toLowerCase().includes(query)) {
                    return;
                }

                const item = document.createElement('div');
                item.className = `entry-item ${currentEntryId === idStr ? 'active' : ''}`;
                item.onclick = () => loadEntry(idStr);

                const currentMood = entry.mood || '😊';

                item.innerHTML = `
                    <div class="date">${entry.display_date}</div>
                    <div class="entry-meta-row">
                        <span style="font-size:1.1rem; line-height:1;">${currentMood}</span>
                        <div class="preview">${cleanText || 'Empty memory...'}</div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function createNewEntry() {
            const now = new Date();
            const idStr = 'entry_' + now.getTime();
            const displayDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            entries[idStr] = {
                text: '',
                display_date: displayDate,
                canvasAssets: [],
                mood: '😊'
            };

            localStorage.setItem('private_floral_diary_entries', JSON.stringify(entries));
            renderEntryList();
            loadEntry(idStr);
        }

        function loadEntry(idStr) {
            currentEntryId = idStr;
            const entry = entries[idStr];

            document.getElementById('displayDate').innerText = entry.display_date;
            const editorInput = document.getElementById('diaryText');
            editorInput.innerHTML = entry.text;

            // Clear legacy layout items
            document.querySelectorAll('.scrapbook-asset').forEach(el => el.remove());

            // Build Canvas Layer Stickers/Photos
            if (entry.canvasAssets && Array.isArray(entry.canvasAssets)) {
                entry.canvasAssets.forEach(assetData => rebuildAssetOnWorkspace(assetData));
            }

            setEntryMood(entry.mood || '😊');

            document.getElementById('editorContainer').style.display = 'flex';
            document.getElementById('moodPickerContainer').style.display = 'flex';
            document.getElementById('saveBtn').style.display = 'inline-flex';
            document.getElementById('deleteBtn').style.display = 'inline-flex';

            document.querySelectorAll('.entry-item').forEach(item => item.classList.remove('active'));
            renderEntryList();
        }

        function saveCurrentEntry() {
            if (!currentEntryId) return;

            // Collect assets metrics coordinates
            const compiledAssets = [];
            document.querySelectorAll('.scrapbook-asset').forEach(assetEl => {
                compiledAssets.push({
                    id: assetEl.id,
                    type: assetEl.classList.contains('sticker-asset') ? 'sticker' : 'photo',
                    content: assetEl.getAttribute('data-content'),
                    top: assetEl.style.top,
                    left: assetEl.style.left,
                    width: assetEl.style.width,
                    height: assetEl.style.height,
                    transform: assetEl.style.transform,
                    frameClass: assetEl.getAttribute('data-frame') || 'frame-none'
                });
            });

            entries[currentEntryId].text = document.getElementById('diaryText').innerHTML;
            entries[currentEntryId].canvasAssets = compiledAssets;
            entries[currentEntryId].mood = selectedMood;

            localStorage.setItem('private_floral_diary_entries', JSON.stringify(entries));
            renderEntryList();
            alert("Entry saved safely to your device! ✨");
        }

        function deleteCurrentEntry() {
            if (!currentEntryId) return;
            if (confirm("Are you sure you want to let this memory fade away? 🌸")) {
                delete entries[currentEntryId];
                localStorage.setItem('private_floral_diary_entries', JSON.stringify(entries));
                
                currentEntryId = null;
                document.getElementById('editorContainer').style.display = 'none';
                document.getElementById('moodPickerContainer').style.display = 'none';
                document.getElementById('saveBtn').style.display = 'none';
                document.getElementById('deleteBtn').style.display = 'none';
                document.getElementById('displayDate').innerText = "Select or Create an Entry";
                
                document.querySelectorAll('.scrapbook-asset').forEach(el => el.remove());
                renderEntryList();
            }
        }

        // --- Custom Rich Text Editing Operations ---
        function formatDoc(cmd, val = null) {
            document.execCommand(cmd, false, val);
        }

        function insertCuteBullet(emoji) {
            document.execCommand('insertHTML', false, `<ul><li data-emoji="${emoji}">&nbsp;</li></ul>`);
        }

        // --- Interactive Canvas Graphic Layer Engine (Stickers & Drag Logic) ---
        function spawnAsset(type, dataUrlOrEmoji) {
            if(!currentEntryId) return;
            const uniqueId = 'asset_' + Date.now();
            const mockData = {
                id: uniqueId,
                type: type,
                content: dataUrlOrEmoji,
                top: '120px',
                left: '120px',
                width: type === 'photo' ? '140px' : 'auto',
                height: 'auto',
                transform: 'rotate(0deg)',
                frameClass: 'frame-none'
            };
            rebuildAssetOnWorkspace(mockData);
        }

        function rebuildAssetOnWorkspace(data) {
            const workspace = document.getElementById('diaryText');
            const assetNode = document.createElement('div');
            assetNode.id = data.id;
            assetNode.className = `scrapbook-asset ${data.type}-asset`;
            assetNode.style.top = data.top;
            assetNode.style.left = data.left;
            if(data.width) assetNode.style.width = data.width;
            if(data.height) assetNode.style.height = data.height;
            assetNode.style.transform = data.transform;
            assetNode.setAttribute('data-content', data.content);
            assetNode.setAttribute('data-frame', data.frameClass || 'frame-none');

            const frameStyleClass = data.frameClass || 'frame-none';

            let structuralContent = '';
            if (data.type === 'sticker') {
                structuralContent = `<div class="asset-wrapper" style="font-size: 2.5rem;">${data.content}</div>`;
            } else {
                structuralContent = `<div class="asset-wrapper ${frameStyleClass}"><img src="${data.content}" alt="photo"></div>`;
            }

            assetNode.innerHTML = `
                ${structuralContent}
                <div class="control-handle handle-delete" onclick="document.getElementById('${data.id}').remove()">×</div>
                <div class="control-handle handle-resize">⤲</div>
                <div class="control-handle handle-rotate">↻</div>
                ${data.type === 'photo' ? `<div class="control-handle handle-frame" onclick="openFrameSelector('${data.id}', event)">🖼️</div>` : ''}
            `;

            workspace.appendChild(assetNode);
            initializeInteractions(assetNode);
        }

        function handleScrapbookImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                spawnAsset('photo', e.target.result);
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // Reset file input
        }

        function openFrameSelector(assetId, event) {
            event.stopPropagation();
            activeFrameAssetId = assetId;
            const popup = document.getElementById('frameDropdown');
            popup.style.display = 'grid';
            
            const rect = event.target.getBoundingClientRect();
            const parentRect = document.getElementById('mainWorkspace').getBoundingClientRect();
            popup.style.left = (rect.left - parentRect.left) + 'px';
            popup.style.top = (rect.top - parentRect.top + 30) + 'px';
        }

        function applyFrameStyle(styleName) {
            if(!activeFrameAssetId) return;
            const targetAsset = document.getElementById(activeFrameAssetId);
            if(targetAsset) {
                const wrapper = targetAsset.querySelector('.asset-wrapper');
                targetAsset.setAttribute('data-frame', 'frame-' + styleName);
                
                // Reset standard wrapper tags frame classes
                wrapper.className = "asset-wrapper";
                wrapper.classList.add('frame-' + styleName);
            }
            document.getElementById('frameDropdown').style.display = 'none';
        }

        function initializeInteractions(el) {
            let isDragging = false;
            let isResizing = false;
            let isRotating = false;
            let startX, startY, startLeft, startTop, startWidth, startHeight, startAngle;
            let centerX, centerY;

            const handleResize = el.querySelector('.handle-resize');
            const handleRotate = el.querySelector('.handle-rotate');

            // MOUSE & TOUCH DOWN FOR MOVE
            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: false });

            // RESIZE HOOK
            handleResize.addEventListener('mousedown', (e) => { e.stopPropagation(); startResize(e); });
            handleResize.addEventListener('touchstart', (e) => { e.stopPropagation(); startResize(e); }, { passive: false });

            // ROTATE HOOK
            handleRotate.addEventListener('mousedown', (e) => { e.stopPropagation(); startRotate(e); });
            handleRotate.addEventListener('touchstart', (e) => { e.stopPropagation(); startRotate(e); }, { passive: false });

            function getEventCoords(e) {
                if(e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            function startDrag(e) {
                if(e.target.classList.contains('control-handle')) return;
                isDragging = true;
                const coords = getEventCoords(e);
                startX = coords.x;
                startY = coords.y;
                startLeft = parseInt(el.style.left) || el.offsetLeft;
                startTop = parseInt(el.style.top) || el.offsetTop;
                
                document.addEventListener('mousemove', dragMove);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('mouseup', endInteraction);
                document.addEventListener('touchend', endInteraction);
            }

            function dragMove(e) {
                if(!isDragging) return;
                e.preventDefault();
                const coords = getEventCoords(e);
                const dx = coords.x - startX;
                const dy = coords.y - startY;
                el.style.left = (startLeft + dx) + 'px';
                el.style.top = (startTop + dy) + 'px';
            }

            function startResize(e) {
                isResizing = true;
                const coords = getEventCoords(e);
                startX = coords.x;
                startY = coords.y;
                startWidth = el.offsetWidth;
                startHeight = el.offsetHeight;

                document.addEventListener('mousemove', resizeMove);
                document.addEventListener('touchmove', resizeMove, { passive: false });
                document.addEventListener('mouseup', endInteraction);
                document.addEventListener('touchend', endInteraction);
            }

            function resizeMove(e) {
                if(!isResizing) return;
                e.preventDefault();
                const coords = getEventCoords(e);
                const dx = coords.x - startX;
                const dy = coords.y - startY;
                el.style.width = Math.max(40, startWidth + dx) + 'px';
                el.style.height = el.classList.contains('sticker-asset') ? 'auto' : Math.max(40, startHeight + dy) + 'px';
            }

            function startRotate(e) {
                isRotating = true;
                const coords = getEventCoords(e);
                const rect = el.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
                startAngle = Math.atan2(coords.y - centerY, coords.x - centerX);
                
                const currentTransform = el.style.transform || 'rotate(0deg)';
                const match = currentTransform.match(/rotate\(([^)]+)deg\)/);
                currentRotationDeg = match ? parseFloat(match[1]) : 0;

                document.addEventListener('mousemove', rotateMove);
                document.addEventListener('touchmove', rotateMove, { passive: false });
                document.addEventListener('mouseup', endInteraction);
                document.addEventListener('touchend', endInteraction);
            }

            function rotateMove(e) {
                if(!isRotating) return;
                e.preventDefault();
                const coords = getEventCoords(e);
                const angle = Math.atan2(coords.y - centerY, coords.x - centerX);
                const diff = angle - startAngle;
                const deg = currentRotationDeg + (diff * 180 / Math.PI);
                el.style.transform = `rotate(${deg}deg)`;
            }

            function endInteraction() {
                isDragging = false;
                isResizing = false;
                isRotating = false;
                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('mousemove', resizeMove);
                document.removeEventListener('touchmove', resizeMove);
                document.removeEventListener('mousemove', rotateMove);
                document.removeEventListener('touchmove', rotateMove);
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `diary_backup_${Date.now()}.json`);
            dlAnchorElem.click();
        }
    </script>
</body>
</html>
